<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="735" viewBox="0 0 1500 735" role="img" aria-labelledby="title desc">
<title id="title">薄肌续航的四项记录</title>
<desc id="desc">身体续航由活动与心肺、力量与动作、恢复与节奏、饮食与日常共同支持。记录状态，用来调整下一次安排。</desc>
<defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3afa2" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1500" height="735" rx="28" fill="#f5f1e8"/>
<text x="64" y="81" font-size="40" fill="#20322b" font-weight="700">薄肌续航：维护能支持行动的身体</text><text x="66" y="129" font-size="24" fill="#5f6a63">活动、力量、恢复、饮食：四项一起看，记录自己真实的变化。</text><rect x="64" y="180" width="666" height="185" rx="22" fill="#dce8dc"/><text x="93" y="237" font-size="26" fill="#5f6a63" font-weight="700">01</text><text x="158" y="237" font-size="33" fill="#20322b" font-weight="700">活动与心肺</text><text x="94" y="292" font-size="25" fill="#20322b">记录活动习惯与日常耐力</text><text x="94" y="333" font-size="24" fill="#5f6a63">从适合自己的活动开始</text><rect x="770" y="180" width="666" height="185" rx="22" fill="#f3dfaa"/><text x="799" y="237" font-size="26" fill="#5f6a63" font-weight="700">02</text><text x="864" y="237" font-size="33" fill="#20322b" font-weight="700">力量与动作</text><text x="800" y="292" font-size="25" fill="#20322b">观察动作控制与完成难度</text><text x="800" y="333" font-size="24" fill="#5f6a63">依据表现调整训练</text><rect x="64" y="393" width="666" height="185" rx="22" fill="#f4d5c8"/><text x="93" y="450" font-size="26" fill="#5f6a63" font-weight="700">03</text><text x="158" y="450" font-size="33" fill="#20322b" font-weight="700">恢复与节奏</text><text x="94" y="505" font-size="25" fill="#20322b">记录睡眠、疲劳与恢复</text><text x="94" y="546" font-size="24" fill="#5f6a63">把总量调到能持续</text><rect x="770" y="393" width="666" height="185" rx="22" fill="#e7e9df"/><text x="799" y="450" font-size="26" fill="#5f6a63" font-weight="700">04</text><text x="864" y="450" font-size="33" fill="#20322b" font-weight="700">饮食与日常</text><text x="800" y="505" font-size="25" fill="#20322b">关注规律性与实际需求</text><text x="800" y="546" font-size="24" fill="#5f6a63">让安排适合生活节奏</text><rect x="64" y="615" width="1372" height="79" rx="22" fill="#20322b"/><text x="750" y="666" font-size="28" fill="#fffaf1" font-weight="600" text-anchor="middle">记录 → 观察状态 → 调整投入 → 继续行动</text>
</svg>
