<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
<title id="title">37% 参照系与现实应用</title>
<desc id="desc">经典模型中有100个随机顺序的候选，先观察前37个，从第38个开始接受第一个优于此前全部候选者。现实中能回看和比较时，使用候选表、预算与截止日期。</desc>
<defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3afa2" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1500" height="780" rx="28" fill="#f5f1e8"/>
<text x="64" y="80" font-size="40" fill="#20322b" font-weight="700">37% 参照系：先形成比较标准，再选择</text><text x="66" y="130" font-size="24" fill="#5f6a63">经典秘书问题 · 总数已知 · 随机顺序 · 当场决定 · 拒绝后不能回选</text><rect x="64" y="177" width="1372" height="111" rx="22" fill="#20322b"/><text x="111" y="243" font-size="43" fill="#fffaf1" font-weight="700">N = 100</text><text x="431" y="243" font-size="35" fill="#f3dfaa" font-weight="700">观察前 37 个</text><text x="875" y="243" font-size="35" fill="#dce8dc" font-weight="700">从第 38 个开始选择</text><rect x="64" y="326" width="1372" height="88" rx="16" fill="#dce8dc"/><path d="M80 326 H571.64 V414 H80 Q64 414 64 398 V342 Q64 326 80 326Z" fill="#e3b956"/><text x="317.82" y="382" font-size="29" fill="#20322b" font-weight="700" text-anchor="middle">37% · 建立参照</text><text x="1003.8199999999999" y="382" font-size="28" fill="#20322b" font-weight="700" text-anchor="middle">63% · 接受第一个刷新纪录的候选</text><path d="M571.64 311 V430" fill="none" stroke="#20322b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="456" font-size="22" fill="#5f6a63">1</text><text x="554.64" y="456" font-size="22" fill="#5f6a63" text-anchor="end">37</text><text x="588.64" y="456" font-size="22" fill="#5f6a63">38</text><text x="1433" y="456" font-size="22" fill="#5f6a63" text-anchor="end">100</text><rect x="64" y="494" width="444" height="191" rx="22" fill="#f3dfaa"/><text x="91" y="540" font-size="25" fill="#5f6a63" font-weight="700">01</text><text x="150" y="540" font-size="31" fill="#20322b" font-weight="700">观察</text><text x="91" y="594" font-size="24" fill="#20322b">暂不接受前 37 个候选</text><text x="91" y="637" font-size="23" fill="#20322b">记住其中最优者</text><rect x="528" y="494" width="444" height="191" rx="22" fill="#dce8dc"/><text x="555" y="540" font-size="25" fill="#5f6a63" font-weight="700">02</text><text x="614" y="540" font-size="31" fill="#20322b" font-weight="700">选择</text><text x="555" y="594" font-size="24" fill="#20322b">从第 38 个开始</text><text x="555" y="637" font-size="23" fill="#20322b">遇到优于此前全部候选者就选</text><rect x="992" y="494" width="444" height="191" rx="22" fill="#e7e9df"/><text x="1019" y="540" font-size="25" fill="#5f6a63" font-weight="700">03</text><text x="1078" y="540" font-size="31" fill="#20322b" font-weight="700">用于现实</text><text x="1019" y="594" font-size="24" fill="#20322b">能回看或并行比较时</text><text x="1019" y="637" font-size="23" fill="#20322b">用候选表、预算和截止日期</text><text x="66" y="739" font-size="24" fill="#5f6a63">37% 来自特定数学条件；日常应用保留“先探索、后聚焦”的思路。</text>
</svg>
