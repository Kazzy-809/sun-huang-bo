<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="795" viewBox="0 0 1500 795" role="img" aria-labelledby="title desc">
<title id="title">资产四象限</title>
<desc id="desc">横向比较为自己目标服务和为外界评价服务，纵向比较高维护与低维护。分别检查高投入成长、高维护展示、可持续积累和低成本装点。</desc>
<defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3afa2" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1500" height="795" rx="28" fill="#f5f1e8"/>
<text x="64" y="80" font-size="40" fill="#20322b" font-weight="700">资产四象限：这项投入在为谁服务？</text><text x="66" y="128" font-size="24" fill="#5f6a63">把钱、时间、精力的持续投入，与自己真正想要的结果放在一起看。</text><text x="452" y="199" font-size="28" fill="#20322b" font-weight="700" text-anchor="middle">为自己的目标服务</text><text x="1121" y="199" font-size="28" fill="#20322b" font-weight="700" text-anchor="middle">主要为外界评价服务</text><rect x="148" y="232" width="611" height="215" rx="22" fill="#dce8dc"/><text x="180" y="295" font-size="33" fill="#20322b" font-weight="700">高投入成长</text><text x="180" y="344" font-size="25" fill="#20322b">专项训练 · 长线作品</text><text x="180" y="397" font-size="24" fill="#5f6a63">确认它是否值得持续投入</text><rect x="825" y="232" width="611" height="215" rx="22" fill="#f4d5c8"/><text x="857" y="295" font-size="33" fill="#20322b" font-weight="700">高维护展示</text><text x="857" y="344" font-size="25" fill="#20322b">持续为评价追加资源</text><text x="857" y="397" font-size="24" fill="#5f6a63">辨别必要表达与面子负担</text><rect x="148" y="477" width="611" height="215" rx="22" fill="#c8dcc9"/><text x="180" y="540" font-size="33" fill="#20322b" font-weight="700">可持续积累</text><text x="180" y="589" font-size="25" fill="#20322b">日常活动 · 可复用技能</text><text x="180" y="642" font-size="24" fill="#5f6a63">优先保留有用且能坚持的部分</text><rect x="825" y="477" width="611" height="215" rx="22" fill="#f3dfaa"/><text x="857" y="540" font-size="33" fill="#20322b" font-weight="700">低成本装点</text><text x="857" y="589" font-size="25" fill="#20322b">一次性跟风 · 即时认同</text><text x="857" y="642" font-size="24" fill="#5f6a63">留意它是否分散了主要精力</text><text x="88" y="318" font-size="26" fill="#20322b" font-weight="700" text-anchor="middle">高</text><text x="88" y="356" font-size="26" fill="#20322b" text-anchor="middle">维</text><text x="88" y="394" font-size="26" fill="#20322b" text-anchor="middle">护</text><text x="88" y="563" font-size="26" fill="#20322b" font-weight="700" text-anchor="middle">低</text><text x="88" y="601" font-size="26" fill="#20322b" text-anchor="middle">维</text><text x="88" y="639" font-size="26" fill="#20322b" text-anchor="middle">护</text><text x="66" y="754" font-size="24" fill="#5f6a63">自己喜欢的表达，也可以服务真实目标；归类依据是你的动机与实际代价。</text>
</svg>
