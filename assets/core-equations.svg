<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="735" viewBox="0 0 1500 735" role="img" aria-labelledby="title desc">
<title id="title">孙学 ROI 与成本拆解</title>
<desc id="desc">结果收益乘以实现概率，除以直接成本、评价消耗与切换成本。用可比尺度比较方案，概率未知时比较情景。</desc>
<defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3afa2" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1500" height="735" rx="28" fill="#f5f1e8"/>
<text x="64" y="80" font-size="40" fill="#20322b" font-weight="700">核心方程：把收益和代价放到同一张纸上</text><text x="66" y="129" font-size="24" fill="#5f6a63">ROI 启发式 · 先比较选项，再设计能降低成本的小试验</text><rect x="64" y="177" width="1372" height="256" rx="22" fill="#20322b"/><text x="132" y="319" font-size="58" fill="#fffaf1" font-weight="700">ROI ≈</text><text x="903" y="261" font-size="38" fill="#fffaf1" font-weight="700" text-anchor="middle">结果收益 R × 实现概率 P</text><path d="M468 285 H1338" fill="none" stroke="#d2dacf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="903" y="349" font-size="29" fill="#dee4da" text-anchor="middle">直接成本 C + 评价消耗 E + 切换成本 S</text><rect x="64" y="467" width="444" height="166" rx="22" fill="#dce8dc"/><text x="92" y="522" font-size="35" fill="#20322b" font-weight="700">C</text><text x="149" y="520" font-size="28" fill="#20322b" font-weight="700">把必要投入算清</text><text x="92" y="584" font-size="24" fill="#20322b">时间、金钱、机会成本</text><rect x="528" y="467" width="444" height="166" rx="22" fill="#f3dfaa"/><text x="556" y="522" font-size="35" fill="#20322b" font-weight="700">E</text><text x="613" y="520" font-size="28" fill="#20322b" font-weight="700">减少无关评价消耗</text><text x="556" y="584" font-size="24" fill="#20322b">辨别面子压力与实际后果</text><rect x="992" y="467" width="444" height="166" rx="22" fill="#f4d5c8"/><text x="1020" y="522" font-size="35" fill="#20322b" font-weight="700">S</text><text x="1077" y="520" font-size="28" fill="#20322b" font-weight="700">给未来保留机动</text><text x="1020" y="584" font-size="24" fill="#20322b">降低交接与退出的负担</text><text x="66" y="691" font-size="24" fill="#5f6a63">使用条件：可比尺度、明确假设；概率未知时比较情景。</text>
</svg>
