<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
<title id="title">孙黄薄三体耦合飞轮</title>
<desc id="desc">孙学判断方向，黄毛推进执行，薄肌支持身体能力和恢复。三者共同支持真实行动，结果用于更新下一轮判断。</desc>
<defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3afa2" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1500" height="880" rx="28" fill="#f5f1e8"/>
<text x="64" y="80" font-size="40" fill="#20322b" font-weight="700">三体耦合：让判断、行动和续航相互支持</text><text x="66" y="129" font-size="24" fill="#5f6a63">方向决定往哪走，执行让事情发生，身体支持下一轮。</text><path d="M1018 297 C1255 315 1300 400 1260 513" fill="none" stroke="#a3afa2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1008 719 C875 838 625 838 488 719" fill="none" stroke="#a3afa2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M223 513 C178 400 251 315 478 297" fill="none" stroke="#a3afa2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="487" y="183" width="526" height="176" rx="22" fill="#f4d5c8"/><text x="750" y="248" font-size="36" fill="#20322b" font-weight="700" text-anchor="middle">孙学 · 方向</text><text x="750" y="300" font-size="24" fill="#20322b" text-anchor="middle">明确目标 · 比较选项 · 更新判断</text><rect x="914" y="539" width="522" height="180" rx="22" fill="#f3dfaa"/><text x="1175" y="604" font-size="36" fill="#20322b" font-weight="700" text-anchor="middle">黄毛 · 执行</text><text x="1175" y="656" font-size="24" fill="#20322b" text-anchor="middle">主动表达 · 完成交付 · 接住反馈</text><rect x="64" y="539" width="522" height="180" rx="22" fill="#dce8dc"/><text x="325" y="604" font-size="36" fill="#20322b" font-weight="700" text-anchor="middle">薄肌 · 续航</text><text x="325" y="656" font-size="24" fill="#20322b" text-anchor="middle">活动能力 · 恢复空间 · 持续节奏</text><path d="M750 359 V402" fill="none" stroke="#a3afa2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/><path d="M919 575 L858 527" fill="none" stroke="#a3afa2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/><path d="M581 575 L642 527" fill="none" stroke="#a3afa2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/><rect x="560" y="408" width="380" height="119" rx="22" fill="#20322b"/><text x="750" y="459" font-size="30" fill="#fffaf1" font-weight="700" text-anchor="middle">真实行动</text><text x="750" y="499" font-size="24" fill="#d5dfd3" text-anchor="middle">结果进入下一轮判断</text><text x="1226" y="405" font-size="24" fill="#5f6a63" text-anchor="middle">推进</text><text x="273" y="405" font-size="24" fill="#5f6a63" text-anchor="middle">支撑</text><text x="750" y="830" font-size="25" fill="#5f6a63" text-anchor="middle">在每一轮反馈里，找到当前最值得补的一项。</text>
</svg>
