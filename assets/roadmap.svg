<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">30 天行动甘特图</title>
<desc id="desc">横轴为第1到30天。明确目标1到3天，比较候选2到9天，完成作品4到10天，对外反馈8到16天，集中试验13到24天，复盘安排25到30天，活动与恢复贯穿30天。第7、14、24、30天设阶段节点。</desc>
<defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style></defs>
